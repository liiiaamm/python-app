<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: clamp(1rem, 5vw, 3rem);
            background: radial-gradient(ellipse at top left, #dce9df, transparent 65%), #f4f1e9;
            color: #203b36;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }
        .converter-card {
            width: 100%;
            max-width: 460px;
            padding: clamp(1.25rem, 5vw, 2.5rem);
            border: 1px solid #d4ded5;
            border-radius: 24px;
            background: #fffdf8;
            box-shadow: 0 20px 60px rgba(32, 59, 54, 0.1);
        }
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.035em;
        }
        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
        }
        .form-control, .form-select {
            min-height: 48px;
            border-color: #b5c6bd;
            border-radius: 10px;
            background-color: #fffefa;
            color: #203b36;
            font-size: 1rem;
        }
        .form-control::placeholder {
            color: #64766f;
        }
        .form-control:focus, .form-select:focus {
            border-color: #216354;
            box-shadow: 0 0 0 0.25rem rgba(33, 99, 84, 0.18);
        }
        .currency-fields {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: end;
            gap: 0.75rem;
        }
        .currency-arrow {
            display: grid;
            min-height: 48px;
            place-items: center;
            color: #64766f;
        }
        .btn-primary {
            min-height: 52px;
            border-radius: 10px;
            font-weight: 600;
            --bs-btn-bg: #216354;
            --bs-btn-border-color: #216354;
            --bs-btn-hover-bg: #184b40;
            --bs-btn-hover-border-color: #184b40;
            --bs-btn-active-bg: #123e34;
            --bs-btn-active-border-color: #123e34;
            --bs-btn-focus-shadow-rgb: 33, 99, 84;
        }
        .result-box {
            padding: 1rem;
            border-radius: 12px;
            background: #e7f0e8;
            color: #184b40;
            font-size: clamp(1.25rem, 5vw, 1.5rem);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }
        @media (max-width: 360px) {
            .currency-fields {
                grid-template-columns: minmax(0, 1fr);
                gap: 0.25rem;
            }
            .currency-arrow {
                min-height: 28px;
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <main class="card converter-card">
        <h1 class="text-center mb-4">Conversor de Divisas</h1>

        <form method="post">
            <div class="mb-3">
                <label for="amount" class="form-label">Cantidad</label>
                <input id="amount" type="number" step="0.01" name="amount"
                       class="form-control form-control-lg" 
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="currency-fields mb-4">
                <div>
                    <label for="from_currency" class="form-label">De</label>
                    <select id="from_currency" name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="currency-arrow" aria-hidden="true">
                    →
                </div>
                <div>
                    <label for="to_currency" class="form-label">A</label>
                    <select id="to_currency" name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box" role="status">
                {{ result }}
            </div>
        {% endif %}
    </main>

</body>
</html>
