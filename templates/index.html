<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at top left, #dce9df, transparent 65%), #f4f1e9;
            color: #203b36;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }
        .site-header {
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(32, 59, 54, 0.12);
            box-shadow: 0 4px 20px rgba(32, 59, 54, 0.1);
        }
        .site-navbar {
            max-width: 1080px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            color: #184b40;
            text-decoration: none;
        }
        .brand-logo {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            padding: 10px;
            border-radius: 14px;
            color: #fff;
            background: #184b40;
        }
        .brand-name {
            display: block;
            font-size: 1.4rem;
            font-weight: 750;
            letter-spacing: -0.04em;
            line-height: 1.2;
        }
        .brand-description {
            display: block;
            margin-top: 3px;
            color: #64766f;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .navbar-link {
            display: block;
            padding: 10px 16px;
            border-radius: 10px;
            color: #3d554f;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }
        .navbar-link:hover,
        .navbar-link[aria-current="page"] {
            color: #184b40;
            background: #e7f0e8;
        }
        .site-navbar a:focus-visible {
            outline: 3px solid #216354;
            outline-offset: 4px;
        }
        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }
        .converter-card {
            width: 100%;
            max-width: 460px;
            padding: clamp(1.25rem, 5vw, 2.5rem);
            border: 1px solid #d4ded5;
            border-radius: 24px;
            background: #fffdf8;
            box-shadow: 0 20px 60px rgba(32, 59, 54, 0.1);
        }
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.035em;
        }
        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
        }
        .form-control, .form-select {
            min-height: 48px;
            border-color: #b5c6bd;
            border-radius: 10px;
            background-color: #fffefa;
            color: #203b36;
            font-size: 1rem;
        }
        .form-control::placeholder {
            color: #64766f;
        }
        .form-control:focus, .form-select:focus {
            border-color: #216354;
            box-shadow: 0 0 0 0.25rem rgba(33, 99, 84, 0.18);
        }
        .currency-fields {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: end;
            gap: 0.75rem;
        }
        .currency-arrow {
            display: grid;
            min-height: 48px;
            place-items: center;
            color: #64766f;
        }
        .btn-primary {
            min-height: 52px;
            border-radius: 10px;
            font-weight: 600;
            --bs-btn-bg: #216354;
            --bs-btn-border-color: #216354;
            --bs-btn-hover-bg: #184b40;
            --bs-btn-hover-border-color: #184b40;
            --bs-btn-active-bg: #123e34;
            --bs-btn-active-border-color: #123e34;
            --bs-btn-focus-shadow-rgb: 33, 99, 84;
        }
        .result-box {
            padding: 1rem;
            border-radius: 12px;
            background: #e7f0e8;
            color: #184b40;
            font-size: clamp(1.25rem, 5vw, 1.5rem);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }
        @media (max-width: 360px) {
            .currency-fields {
                grid-template-columns: minmax(0, 1fr);
                gap: 0.25rem;
            }
            .currency-arrow {
                min-height: 28px;
                transform: rotate(90deg);
            }
        }
        @media (max-width: 575px) {
            .site-navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 16px 20px;
            }
            .navbar-links {
                width: 100%;
            }
            .navbar-links li {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="site-navbar" aria-label="Navegación principal">
            <a class="navbar-brand" href="{{ url_for('home') }}" aria-label="Divisa: inicio">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M4 7h16m-5-5 5 5-5 5M20 17H4m5-5-5 5 5 5" />
                </svg>
                <span>
                    <span class="brand-name">Divisa</span>
                    <span class="brand-description">Conversor de monedas</span>
                </span>
            </a>
            <ul class="navbar-links">
                <li><a class="navbar-link" href="#conversor" aria-current="page">Conversor</a></li>
                <li><a class="navbar-link" href="https://github.com/liiiaamm/python-app">Ver proyecto</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content" id="conversor">
        <div class="card converter-card">
            <h1 class="text-center mb-4">Conversor de Divisas</h1>

            <form method="post">
                <div class="mb-3">
                    <label for="amount" class="form-label">Cantidad</label>
                    <input id="amount" type="number" step="0.01" name="amount"
                           class="form-control form-control-lg"
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="currency-fields mb-4">
                    <div>
                        <label for="from_currency" class="form-label">De</label>
                        <select id="from_currency" name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="currency-arrow" aria-hidden="true">
                        →
                    </div>
                    <div>
                        <label for="to_currency" class="form-label">A</label>
                        <select id="to_currency" name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box" role="status">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>
